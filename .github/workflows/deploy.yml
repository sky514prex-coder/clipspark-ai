name: Deploy ClipRush AI to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Show build output
        run: |
          echo "=== .output ===" && ls -la .output/ 2>/dev/null || echo "(not found)"
          echo "=== .vinxi ===" && ls -la .vinxi/ 2>/dev/null || echo "(not found)"
          echo "=== dist ===" && ls -la dist/ 2>/dev/null || echo "(not found)"
          echo "=== .cloudflare ===" && ls -la .cloudflare/ 2>/dev/null || echo "(not found)"

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          secrets: |
            CODEWORDS_API_KEY
            SUPABASE_SERVICE_ROLE_KEY
        env:
          CODEWORDS_API_KEY: ${{ secrets.CODEWORDS_API_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
